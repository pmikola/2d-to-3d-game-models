# Default configuration for 2D-to-3D Pipeline
# Override via CLI arguments or by editing this file.

# Pipeline backend: default to Hunyuan3D-2.1 fp16 shape generation
pipeline:
  backend: "hunyuan3d"         # Default: Hunyuan3D-2.1 shape-only profile
  hunyuan3d_model_path: "tencent/Hunyuan3D-2.1"  # Official fp16 shape model repo
  skip_texturing: true         # Export geometry only (no texture stage)
  game_ready: true             # Decimate Hunyuan meshes for game-ready export
  game_ready_target_faces: 120000  # Target face count — 120K preserves detail while staying game-ready
  use_multiview: false         # false = single-view (more reliable), true = multi-view
  multiview_generator: "mvadapter"  # "mvadapter", "charactergen", or "none"
  chargen_path: null           # Path to cloned CharacterGen repo (only for "charactergen")

# Preprocessing
preprocessing:
  target_size: 512           # Image resize target (matches Hi3DGen's NiRNE input)
  remove_background: true    # Use rembg for background removal
  bg_model: "birefnet-general"  # rembg model for bg removal (birefnet-general, u2net, etc.)
  quality_check: true        # Warn on low-res or blurry images

# Geometry Generation (Hi3DGen)
geometry:
  seed: 42
  guidance_scale: 7.5
  num_inference_steps: 50
  model_id: "Stable-X/trellis-normal-v0-1"

# Texture Generation (legacy Hi3DGen path only)
texturing:
  seed: 42
  prompt: null               # Auto-generated from input image if null
  num_viewpoints: 36         # Reduced automatically for low VRAM / CPU
  ddim_steps: 50             # Reduced automatically for low VRAM / CPU
  guidance_scale: 7.5
  strength: 0.7
  model_id: "stabilityai/stable-diffusion-2-depth"
  caption_model: "Salesforce/blip-image-captioning-base"

# Mesh Repair (post-geometry, pre-texturing)
mesh_repair:
  enabled: true
  smooth_iterations: 0         # 0 for stylized/low-poly art (preserves sharp edges)
  decimate_ratio: null         # Ratio of faces to keep (null = no decimation, 0.5 = 50%)

# PBR Map Generation
pbr:
  enabled: false               # Shape-only default; not used by Hunyuan3D-2.1 profile
  normal_strength: 1.0         # Normal map intensity
  base_roughness: 0.7          # Base roughness value

# Export
export:
  format: "glb"              # Output format (glb = binary glTF 2.0)
  embed_textures: false      # Shape-only default does not embed textures
  metallic_factor: 0.0       # PBR metallic factor
  roughness_factor: 0.8      # PBR roughness factor

# MV-Adapter multi-view generation (used by "full" backend)
# Replaces Zero123++ with MV-Adapter (ICCV 2025) for higher resolution
# (768x768 vs 320x320) and better view consistency. ~14GB VRAM.
zero123:
  num_inference_steps: 50
  guidance_scale: 3.0

# Dynamic range / exposure correction
exposure:
  enabled: false
  low_percentile: 1.0
  high_percentile: 99.0

# Hunyuan3D-2mv shape generation
shape_multiview:
  octree_resolution: 512  # 512 = 2.4x finer than 384, fits 16GB with num_chunks=20000

# Hunyuan3D Paint PBR texturing
paint:
  max_views: 6
  resolution: 512
  use_remesh: true
  mmgp_profile: "LowRAM_LowVRAM"

# Hardware
device:
  force_cpu: false
  vram_min_geometry: 8.0     # GB — fallback to CPU if below this
  vram_min_texturing: 10.0   # GB — reduce texture quality if below this
  vram_comfortable: 16.0     # GB — full quality settings
